<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catherine Macharia | QR card</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<main class="card-page">
  <div>
    <article class="qr-card">
      <header>
        <h1>Catherine Macharia</h1>
        <p>Co-Founder, Flexbyte Solutions<br>Software Engineer, AfCEN</p>
      </header>
      <div class="qr-body">
        <img src="assets/qr/catherine-macharia-qr.svg" alt="QR code linking to cate-macharia.github.io/portfolio/catherine" width="280" height="280">
        <p class="scan">Scan to read my story</p>
        <p class="url">cate-macharia.github.io/portfolio/catherine</p>
      </div>
    </article>
    <p class="card-actions"><button class="btn btn-teal" type="button" onclick="window.print()">Print this card</button></p>
  </div>
</main>
</body>
</html>
